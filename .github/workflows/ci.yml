name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push supersedes an in-flight run for the same branch.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22.12.0'
  PNPM_VERSION: '9.15.4'

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Packages must be built first: apps consume their compiled output, not src.
      - name: Build packages
        run: pnpm run build --filter="./packages/*"

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test

      - name: Build
        run: pnpm run build

  integration:
    name: Integration tests (Postgres + PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # PostGIS is not optional: the discovery queries and the geography
        # columns do not exist without it.
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: try
          POSTGRES_PASSWORD: try
          POSTGRES_DB: try_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://try:try@localhost:5432/try_test
      TEST_DATABASE_URL: postgres://try:try@localhost:5432/try_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build --filter="./packages/*"

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed
        run: pnpm db:seed

      # These are the tests that prove capacity cannot be oversold and a double
      # tap cannot double-book. Without a database they skip, so they must run here.
      - name: Integration tests
        run: pnpm run test:integration
